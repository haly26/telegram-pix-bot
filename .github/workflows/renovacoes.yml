
name: Rotina de assinaturas Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  renovar-assinaturas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar rotina de assinaturas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FLOWINPAY_API_KEY: ${{ secrets.FLOWINPAY_API_KEY }}
          PAYMENT_PROVIDER: flowinpay
        run: python worker.py
